kind = "web"
previewPath = "/"
title = "Healthy Nation"
version = "1.0.0"
id = "artifacts/healthy-nation"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23649

[services.development]
run = "pnpm --filter @workspace/healthy-nation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/healthy-nation", "run", "build" ]
publicDir = "artifacts/healthy-nation/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23649"
BASE_PATH = "/"
